[project]
name = "pomodoro"
version = "0.1.0"
description = "A flexible pomodoro-style alarm app"
readme = "README.md"
authors = [
    { name = "Micah Pawlicki", email = "mich.pawlicki@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pomodoro = "pomodoro:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
